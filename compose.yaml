# MongoDB de desarrollo local; PostgreSQL solo se inicia con el perfil benchmark.
# Oracle de la aplicación se configura con el servidor del equipo/curso.
services:
  mongodb:
    image: mongo:8.0
    container_name: cineconecta-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - cineconecta_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
  postgres-benchmark:
    image: postgres:16
    container_name: cineconecta-postgres-benchmark
    profiles: ["benchmark"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: cineconecta_benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: ${POSTGRES_BENCH_PASSWORD:-local_benchmark_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cineconecta_pg_benchmark_data:/var/lib/postgresql/data
      - ./database/postgresql/benchmark:/benchmark:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d cineconecta_benchmark"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  cineconecta_mongo_data:
  cineconecta_pg_benchmark_data:
