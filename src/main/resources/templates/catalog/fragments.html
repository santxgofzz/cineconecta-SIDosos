<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf?.token}">
  <meta name="_csrf_header" th:content="${_csrf?.headerName}">
  <title th:text="|${title} · CineConecta|">CineConecta</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/catalog.css}">
  <script defer th:src="@{/js/catalog.js}"></script>
</head>
<body>
<header class="catalog-header" th:fragment="header(admin)">
  <a class="catalog-brand" th:href="${admin} ? @{/admin/contents} : @{/}">CineConecta</a>
  <span th:text="${admin} ? 'Administración' : 'Catálogo'"></span>
</header>
<div class="catalog-cover" th:fragment="cover(item)">
  <span>Portada no disponible</span>
  <img alt="" loading="lazy" referrerpolicy="no-referrer" th:attr="data-cover=${item.coverUrl}">
</div>
<span th:fragment="type(value)" th:switch="${value}">
  <span th:case="'movie'">Película</span>
  <span th:case="'series'">Serie</span>
  <span th:case="'documentary'">Documental</span>
</span>
</body>
</html>
