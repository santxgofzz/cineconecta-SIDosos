<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{catalog/fragments :: head(${detail.content.title})}"></head>
<body class="catalog-ui">
<header th:replace="~{catalog/fragments :: header(false)}"></header>
<main class="catalog-main" th:with="item=${detail.content}">
  <a th:href="@{/profiles/{profileId}/catalog(profileId=${profileId})}">Volver al catálogo</a>
  <article class="catalog-detail">
    <div th:replace="~{catalog/fragments :: cover(${item})}"></div>
    <div>
      <p class="catalog-muted"><span th:replace="~{catalog/fragments :: type(${item.type})}"></span>
        <span th:text="| · ${item.releaseYear} · ${item.ageRating}+|"></span></p>
      <h1 th:text="${item.title}"></h1>
      <p th:text="${detail.synopsis}"></p>
      <dl>
        <dt>Géneros</dt><dd th:text="${#strings.listJoin(item.genres, ', ')}"></dd>
        <dt>Países</dt><dd th:text="${#strings.listJoin(detail.countries, ', ')}"></dd>
        <dt>Audio</dt><dd th:text="${#strings.listJoin(detail.audioLanguages, ', ')}"></dd>
        <dt th:unless="${detail.subtitleLanguages.empty}">Subtítulos</dt>
        <dd th:unless="${detail.subtitleLanguages.empty}" th:text="${#strings.listJoin(detail.subtitleLanguages, ', ')}"></dd>
        <dt th:if="${detail.director}">Dirección</dt><dd th:if="${detail.director}" th:text="${detail.director}"></dd>
        <dt th:if="${detail.durationSeconds}">Duración</dt>
        <dd th:if="${detail.durationSeconds}" th:text="|${detail.durationSeconds / 60} min ${detail.durationSeconds % 60} s|"></dd>
        <dt th:if="${detail.topics != null and !detail.topics.empty}">Temas</dt>
        <dd th:if="${detail.topics != null and !detail.topics.empty}" th:text="${#strings.listJoin(detail.topics, ', ')}"></dd>
        <dt th:if="${detail.interviewees != null and !detail.interviewees.empty}">Personas entrevistadas</dt>
        <dd th:if="${detail.interviewees != null and !detail.interviewees.empty}" th:text="${#strings.listJoin(detail.interviewees, ', ')}"></dd>
        <dt th:unless="${detail.sources.empty}">Fuentes</dt>
        <dd th:unless="${detail.sources.empty}" th:text="${#strings.listJoin(detail.sources, ', ')}"></dd>
      </dl>
      <section th:unless="${detail.cast.empty}">
        <h2>Reparto</h2>
        <ul><li th:each="actor : ${detail.cast}" th:text="${actor.character == null or actor.character.empty ? actor.name : actor.name + ' · ' + actor.character}"></li></ul>
      </section>
      <div class="catalog-actions">
        <a class="catalog-primary" th:if="${item.type != 'series'}" th:href="@{/profiles/{profileId}/player(profileId=${profileId},contentId=${item.id})}">Reproducir</a>
        <button type="button" data-list-method="PUT" th:attr="data-list-url=@{/api/profiles/{profileId}/my-list/{id}(profileId=${profileId},id=${item.id})}" hidden>Agregar a Mi lista</button>
        <button type="button" data-list-method="DELETE" th:attr="data-list-url=@{/api/profiles/{profileId}/my-list/{id}(profileId=${profileId},id=${item.id})}" hidden>Quitar de Mi lista</button>
      </div>
      <p id="catalog-feedback" role="status" aria-live="polite"></p>
    </div>
  </article>
  <section th:unless="${detail.seasons.empty}" aria-labelledby="catalog-seasons">
    <h2 id="catalog-seasons">Temporadas y episodios</h2>
    <details class="catalog-panel" th:each="season : ${detail.seasons}" th:open="${seasonStat.first}">
      <summary th:text="|Temporada ${season.number}|"></summary>
      <p th:text="${season.description}"></p>
      <ol class="catalog-episodes">
        <li th:each="episode : ${season.episodes}" th:value="${episode.number}">
          <h3 th:text="${episode.title}"></h3>
          <p th:text="${episode.synopsis}"></p>
          <p th:text="|${episode.durationSeconds / 60} min ${episode.durationSeconds % 60} s|"></p>
          <a th:href="@{/profiles/{profileId}/player(profileId=${profileId},contentId=${item.id},episodeId=${episode.id})}" th:attr="aria-label=|Reproducir ${episode.title}|">Reproducir episodio</a>
        </li>
      </ol>
    </details>
  </section>
</main>
</body>
</html>
