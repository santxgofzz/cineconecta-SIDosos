<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{catalog/fragments :: head('Administrar catálogo')}"></head>
<body class="catalog-ui">
<header th:replace="~{catalog/fragments :: header(true)}"></header>
<main class="catalog-main">
  <h1>Administrar catálogo</h1>
  <div class="catalog-actions">
    <a class="catalog-primary" th:href="@{/admin/contents/new}">Crear contenido</a>
    <a th:href="@{/admin/reportes/consumo-por-plan}">Informe de consumo</a>
    <form method="post" th:action="@{/admin/logout}"><button type="submit">Cerrar sesión</button></form>
  </div>
  <p role="status" th:if="${notice}" th:text="${notice}"></p>
  <p class="catalog-panel" th:if="${contents.empty}">Esta página no tiene contenidos.</p>
  <div class="catalog-table" th:unless="${contents.empty}">
    <table>
      <caption th:text="|${contents.totalElements} contenidos|"></caption>
      <thead><tr><th scope="col">Título</th><th scope="col">Tipo</th><th scope="col">Estado</th><th scope="col">Acciones</th></tr></thead>
      <tbody>
        <tr th:each="item : ${contents.content}">
          <th scope="row"><span th:text="${item.details.title}"></span>
            <small class="catalog-muted" th:text="${item.id}"></small></th>
          <td><span th:replace="~{catalog/fragments :: type(${item.details.type})}"></span></td>
          <td th:switch="${item.status}">
            <span class="catalog-state" th:case="'draft'">Borrador</span>
            <span class="catalog-state" th:case="'published'">Publicado</span>
            <span class="catalog-state" th:case="'retired'">Retirado</span>
          </td>
          <td>
            <div class="catalog-actions">
              <a th:href="@{/admin/contents/{id}/edit(id=${item.id})}">Editar</a>
              <details th:if="${item.status != 'published'}">
                <summary>Publicar</summary>
                <form method="post" th:action="@{/admin/contents/{id}/publish(id=${item.id})}">
                  <button type="submit">Confirmar publicación</button>
                </form>
              </details>
              <details th:if="${item.status != 'retired'}">
                <summary>Retirar</summary>
                <form method="post" th:action="@{/admin/contents/{id}/retire(id=${item.id})}">
                  <button type="submit">Confirmar retiro</button>
                </form>
              </details>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav class="catalog-actions catalog-pagination" aria-label="Paginación" th:if="${contents.totalPages > 1 or contents.number > 0}">
    <a th:if="${contents.hasPrevious()}" th:href="@{/admin/contents(page=${contents.number - 1})}">Anterior</a>
    <span th:text="|Página ${contents.number + 1} de ${contents.totalPages}|"></span>
    <a th:if="${contents.hasNext()}" th:href="@{/admin/contents(page=${contents.number + 1})}">Siguiente</a>
  </nav>
</main>
</body>
</html>
