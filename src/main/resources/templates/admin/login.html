<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{catalog/fragments :: head('Acceso administrativo')}"></head>
<body class="catalog-ui">
<header th:replace="~{catalog/fragments :: header(true)}"></header>
<main class="catalog-main catalog-login">
  <h1>Administración</h1>
  <p th:if="${param.error}" role="alert">No se pudo iniciar sesión. Revisa las credenciales.</p>
  <p th:if="${param.logout}" role="status">Sesión cerrada.</p>
  <form class="catalog-panel catalog-form" method="post" th:action="@{/admin/login}">
    <label>Usuario <input name="username" autocomplete="username" required maxlength="64"></label>
    <label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit" class="catalog-primary">Entrar</button>
  </form>
  <a th:href="@{/}">Volver a CineConecta</a>
</main>
</body>
</html>
