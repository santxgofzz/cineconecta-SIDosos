<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{catalog/fragments :: head('Editor de catálogo')}"></head>
<body class="catalog-ui">
<header th:replace="~{catalog/fragments :: header(true)}"></header>
<main class="catalog-main">
  <a th:href="@{/admin/contents}">Volver a administración</a>
  <h1 th:text="${item == null} ? 'Crear contenido' : 'Editar contenido'"></h1>
  <noscript>Activa JavaScript para agregar temporadas, episodios y guardar el formulario.</noscript>
  <form class="catalog-form" id="catalog-editor" method="post"
        th:attr="data-initial=${initial},data-revision=${item?.revision},data-return=@{/admin/contents},data-url=${item == null} ? @{/api/admin/contents} : @{/api/admin/contents/{id}(id=${item.id})}">
    <p id="catalog-form-error" role="alert" tabindex="-1"></p>
    <fieldset class="catalog-panel">
      <legend>Datos del contenido</legend>
      <label>Tipo
        <select name="type" data-root required th:disabled="${item != null}">
          <option value="movie">Película</option>
          <option value="series">Serie</option>
          <option value="documentary">Documental</option>
        </select>
      </label>
      <label>Título <input name="title" data-root maxlength="250" required></label>
      <label>Sinopsis <textarea name="synopsis" data-root rows="4" maxlength="5000"></textarea></label>
      <label>Año <input name="releaseYear" data-root type="number" min="1888" max="2100" required></label>
      <label>Clasificación por edad <input name="ageRating" data-root type="number" min="0" max="18" required></label>
      <label>Dirección de portada <input name="coverUrl" data-root type="url" maxlength="2048" required></label>
      <p class="catalog-muted">Separa los géneros, países e idiomas por comas.</p>
      <label>Géneros <input name="genres" data-root data-list required></label>
      <label>Países <input name="countries" data-root data-list required></label>
      <label>Idiomas de audio <input name="audioLanguages" data-root data-list required></label>
      <label>Idiomas de subtítulos <input name="subtitleLanguages" data-root data-list></label>
    </fieldset>
    <fieldset class="catalog-panel" data-types="movie documentary" hidden>
      <legend>Dirección y duración</legend>
      <label>Dirección <input name="director" data-root required></label>
      <label>Duración en segundos <input name="durationSeconds" data-root type="number" min="1" required></label>
    </fieldset>
    <fieldset class="catalog-panel" data-types="movie" hidden>
      <legend>Reparto</legend>
      <div data-rows="cast"></div>
      <button type="button" data-add="cast">Agregar intérprete</button>
    </fieldset>
    <fieldset class="catalog-panel" data-types="documentary" hidden>
      <legend>Documental</legend>
      <label>Temas, separados por comas <input name="topics" data-root data-list required></label>
      <label>Personas entrevistadas, separadas por comas <input name="interviewees" data-root data-list></label>
      <div data-rows="sources"></div>
      <button type="button" data-add="sources">Agregar fuente</button>
    </fieldset>
    <fieldset class="catalog-panel" data-types="series" hidden>
      <legend>Temporadas</legend>
      <div data-rows="seasons"></div>
      <button type="button" data-add="seasons">Agregar temporada</button>
    </fieldset>
    <button class="catalog-primary" type="submit" disabled>Guardar contenido</button>
  </form>

  <template id="row-cast">
    <fieldset class="catalog-row">
      <legend>Intérprete</legend>
      <label>Nombre <input data-key="actorName" required></label>
      <label>Personaje <input data-key="characterName"></label>
      <button type="button" data-remove>Quitar intérprete</button>
    </fieldset>
  </template>
  <template id="row-sources">
    <fieldset class="catalog-row">
      <legend>Fuente</legend>
      <label>Nombre <input data-key="name" required></label>
      <label>Dirección <input data-key="url" type="url" maxlength="2048"></label>
      <button type="button" data-remove>Quitar fuente</button>
    </fieldset>
  </template>
  <template id="row-seasons">
    <fieldset class="catalog-row">
      <legend>Temporada</legend>
      <label>Número <input data-key="number" type="number" min="1" required></label>
      <label>Descripción <textarea data-key="description" rows="2"></textarea></label>
      <div data-rows="episodes"></div>
      <button type="button" data-add="episodes">Agregar episodio</button>
      <button type="button" data-remove>Quitar temporada</button>
    </fieldset>
  </template>
  <template id="row-episodes">
    <fieldset class="catalog-row">
      <legend>Episodio</legend>
      <input type="hidden" data-key="id">
      <label>Número <input data-key="number" type="number" min="1" required></label>
      <label>Título <input data-key="title" required></label>
      <label>Sinopsis <textarea data-key="synopsis" rows="2"></textarea></label>
      <label>Duración en segundos <input data-key="durationSeconds" type="number" min="1" required></label>
      <button type="button" data-remove>Quitar episodio</button>
    </fieldset>
  </template>
</main>
</body>
</html>
