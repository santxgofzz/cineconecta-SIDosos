spring:
  application:
    name: cineconecta
  datasource:
    url: ${ORACLE_JDBC_URL}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    mongodb:
      uri: ${MONGO_URI}
  thymeleaf:
    cache: false
server:
  port: ${SERVER_PORT:8080}
cineconecta:
  report:
    time-zone: ${REPORT_TIME_ZONE:America/Bogota}
