spring:
  application:
    name: cineconecta
  datasource:
    url: ${ORACLE_JDBC_URL}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-timeout: ${ORACLE_CONNECTION_TIMEOUT_MS:3000}
      data-source-properties:
        oracle.net.CONNECT_TIMEOUT: ${ORACLE_CONNECT_TIMEOUT_MS:3000}
        oracle.jdbc.ReadTimeout: ${ORACLE_READ_TIMEOUT_MS:5000}
  jdbc:
    template:
      query-timeout: 5s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    mongodb:
      uri: ${MONGO_URI}
  thymeleaf:
    cache: false
server:
  port: ${SERVER_PORT:8080}
cineconecta:
  report:
    time-zone: ${REPORT_TIME_ZONE:America/Bogota}
